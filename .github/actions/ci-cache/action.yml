name: "CI caches (apt + cargo/highs-sys)"
description: |
  Restore/save the apt package lists and .deb archives (cached download +
  cached `apt-get update`), and the Cargo registry/git + target directory
  (including the bundled highs-sys build).

  All cache keys compose from the caller's `cache-version` (workflow-level
  `env.CI_CACHE_VERSION`) — bump that one value to force a full refresh of
  every cache. The apt key additionally hashes this action file, so adding
  or removing packages here refreshes the apt caches automatically. The
  cargo key additionally includes the resolved `rustc` version and the
  Cargo.lock hash, so a toolchain upgrade or dependency-set change
  invalidates compiled artifacts without a manual version bump (a rustc
  change silently invalidates every fingerprint — if the key did not
  change too, hits would keep serving stale artifacts forever, since
  exact hits never re-save).

inputs:
  cache-version:
    description: >
      Cache generation tag (pass the workflow's env.CI_CACHE_VERSION).
      Bump to force a full refresh of all CI caches.
    required: true
  toolchain:
    description: Rust toolchain in use (included in the cargo cache key).
    required: false
    default: stable
  apt-packages:
    description: Space-separated apt packages to install (Linux only).
    required: false
    default: "build-essential cmake ninja-build pkg-config"

runs:
  using: composite
  steps:
    # ─────────────────────────── apt (options 1+2) ───────────────────────────
    # Option 1: the .deb archives in /var/cache/apt/archives are cached, so a
    # hit means `apt-get install` downloads nothing.
    # Option 2: the package lists in /var/lib/apt/lists are cached too, and
    # `apt-get update` is skipped on an EXACT cache hit (a restore-keys
    # fallback still runs update — stale lists must never be trusted).
    - name: Restore apt cache
      id: apt-restore
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v6
      with:
        path: /tmp/ci-apt-cache
        key: ${{ runner.os }}-${{ runner.arch }}-apt-${{ inputs.cache-version }}-${{ hashFiles('.github/actions/ci-cache/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-apt-${{ inputs.cache-version }}-

    - name: Prepare apt cache staging
      if: runner.os == 'Linux'
      shell: bash
      run: mkdir -p /tmp/ci-apt-cache/archives /tmp/ci-apt-cache/lists

    - name: Seed apt caches
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo mkdir -p /var/cache/apt/archives/partial /var/lib/apt/lists/partial
        # Debs are seeded whenever present (exact hit or fallback): apt uses
        # them as a local mirror and downloads only what is missing.
        sudo cp -n /tmp/ci-apt-cache/archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        # Lists are seeded ONLY on an exact hit — a fallback may be stale
        # relative to the package set this action now declares.
        if [ "${{ steps.apt-restore.outputs.cache-hit }}" = "true" ]; then
          sudo cp -n /tmp/ci-apt-cache/lists/* /var/lib/apt/lists/ 2>/dev/null || true
        fi

    - name: Install native deps
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "${{ steps.apt-restore.outputs.cache-hit }}" = "true" ] \
           && [ -n "$(ls -A /var/lib/apt/lists/ 2>/dev/null)" ]; then
          echo "::notice::using cached apt lists (cache-version ${{ inputs.cache-version }})"
        else
          sudo apt-get update
        fi
        sudo apt-get install -y ${{ inputs.apt-packages }}

    - name: Collect apt debs
      if: always() && runner.os == 'Linux'
      shell: bash
      run: sudo cp -n /var/cache/apt/archives/*.deb /tmp/ci-apt-cache/archives/ 2>/dev/null || true

    - name: Collect apt lists (only after a clean install)
      if: ${{ !cancelled() && !failure() && runner.os == 'Linux' }}
      shell: bash
      run: |
        # The root-owned mode-600 `lock` file is EXCLUDED: the cache-save tar
        # (running as the runner user) cannot read it and the whole save would
        # fail ("/usr/bin/tar ... Cannot open: Permission denied"). The lock
        # has no cache value.
        sudo find /var/lib/apt/lists -maxdepth 1 -type f ! -name lock \
          -exec cp -n {} /tmp/ci-apt-cache/lists/ \; 2>/dev/null || true

    - name: Save apt cache
      # Only the job that did NOT restore saves: concurrent saves of the same
      # key collide ("Unable to reserve cache ... another job may be creating
      # this cache"). The winner's cache serves every job on the next run;
      # after a version bump all jobs miss and one of them saves.
      if: ${{ always() && steps.apt-restore.outputs.cache-hit != 'true' && runner.os == 'Linux' }}
      uses: actions/cache/save@v6
      with:
        path: /tmp/ci-apt-cache
        key: ${{ runner.os }}-${{ runner.arch }}-apt-${{ inputs.cache-version }}-${{ hashFiles('.github/actions/ci-cache/action.yml') }}

    # ─────────────────────── cargo (registry + target) ───────────────────────
    # Caches the dependency downloads AND the compiled artifacts — including
    # the bundled highs-sys build (cmake HiGHS), which is the expensive part.
    # The exact key includes the RESOLVED rustc version (a toolchain upgrade
    # silently invalidates every fingerprint, so the key must change too —
    # otherwise exact hits keep serving stale artifacts forever) and
    # Cargo.lock (dependency-set changes invalidate). The first restore-key
    # falls back to the same-rustc previous generation for partial staleness,
    # which cargo repairs by rebuilding only what changed; the second spans
    # a rustc bump, keeping the registry/git downloads (the compiled half is
    # stale and cargo rebuilds it) until the new-rustc generation is saved.
    - name: Get rustc version
      id: rustc-version
      shell: bash
      run: |
        rustc_ver="$(rustc --version 2>/dev/null || true)"
        rustc_ver="${rustc_ver#rustc }"
        rustc_ver="${rustc_ver%% *}"
        [ -n "$rustc_ver" ] || rustc_ver="unknown"
        echo "rustc=${rustc_ver}" >> "$GITHUB_OUTPUT"

    - name: Restore cargo cache
      id: cargo-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-version }}-${{ inputs.toolchain }}-${{ steps.rustc-version.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-version }}-${{ inputs.toolchain }}-${{ steps.rustc-version.outputs.rustc }}-
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-version }}-${{ inputs.toolchain }}-

    - name: Save cargo cache
      # Only the job that did NOT restore saves (same key-collision rationale
      # as the apt save above; a restore-keys fallback counts as a miss and
      # upgrades the cache to the full key).
      if: ${{ always() && steps.cargo-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-version }}-${{ inputs.toolchain }}-${{ steps.rustc-version.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
