name: CI - Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN: only read repository contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # macOS runs on the repo's self-hosted runner (forge, Apple Silicon) to
    # avoid GitHub-hosted macOS billing; Linux/Windows stay on GitHub-hosted.
    # Only the owner's own PRs/branches may use the self-hosted runner —
    # fork PRs can edit this file, so the guard below (plus repo setting
    # "Require approval for all outside collaborators") keeps fork PRs off it.
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted","macOS","ARM64"]') || matrix.os }}
    if: ${{ matrix.os != 'macos-latest' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'sk-surya/roml' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Compile check (all targets)
        run: cargo check -p roml --all-targets

      - name: Clippy lint check
        run: cargo clippy -p roml --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run -p roml --all-targets

      - name: Run doctests
        run: cargo test -p roml --doc

      - name: Documentation check (no-deps)
        run: cargo doc -p roml --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'

  msrv:
    name: MSRV (Linux, 1.85)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Compile check
        run: cargo check -p roml --all-targets

      - name: Clippy
        run: cargo clippy -p roml --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run -p roml --all-targets

      - name: Run doctests
        run: cargo test -p roml --doc

      - name: Documentation
        run: cargo doc -p roml --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
