name: CI - HiGHS Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI cache generation. ALL cache keys (apt lists/debs, cargo registry,
  # highs-sys/target builds, the system HiGHS install) compose from this one
  # value — bump it and commit to force a full refresh of every cache (e.g.
  # after a runner-image distro bump, an apt mirror change, or a toolchain
  # upgrade). The apt key also hashes .github/actions/ci-cache/action.yml,
  # so package-set changes there refresh the apt caches automatically.
  CI_CACHE_VERSION: "2026-08"

jobs:
  test-bundled:
    name: Test (bundled, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # ./.github/actions/ci-cache owns Cargo/target caching for this
          # workflow, including the bundled highs-sys CMake build. Avoid a
          # second overlapping rust-cache restore/save.
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config
      - name: Verify native build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version
      - name: Test roml-highs (bundled)
        run: cargo nextest run -p roml-highs --features bundled
      - name: Run doctests
        run: cargo test -p roml-highs --features bundled --doc
      - name: Run showcase examples
        shell: bash # the loop is bash syntax; the default pwsh on Windows cannot parse it
        run: |
          for ex in pwl_production_planning warm_start_mip overlay_solve constructs; do
            cargo run -q -p roml-highs --features bundled --example "$ex"
          done

  lint:
    name: Lint + doc (HiGHS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p roml-highs --all-targets --features bundled -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p roml-highs --no-deps --features bundled

  msrv:
    name: MSRV (HiGHS, 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
          toolchain: "1.85"
      - run: cargo check -p roml-highs --features bundled

  feature-exclusivity:
    name: Feature exclusivity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
      - run: "! cargo check -p roml-highs --features bundled,system 2>&1"

  system:
    name: Test (system, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Set HiGHS install prefix
        run: echo "HIGHS_PREFIX=$HOME/highs-install" >> "$GITHUB_ENV"
      - name: Cache HiGHS 1.9.0 install
        id: highs-cache
        uses: actions/cache@v6
        with:
          path: ~/highs-install
          key: highs-1.9.0-${{ runner.os }}-${{ env.CI_CACHE_VERSION }}
      - name: Build HiGHS 1.9.0 from source
        if: steps.highs-cache.outputs.cache-hit != 'true'
        run: |
          HIGHS_VERSION=1.9.0
          curl -fsSL "https://github.com/ERGO-Code/HiGHS/archive/refs/tags/v${HIGHS_VERSION}.tar.gz" -o highs.tar.gz
          tar xzf highs.tar.gz
          cd "HiGHS-${HIGHS_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HIGHS_PREFIX" -GNinja
          ninja && ninja install
      - name: Test roml-highs (system discovery)
        env:
          PKG_CONFIG_PATH: ${{ env.HIGHS_PREFIX }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.HIGHS_PREFIX }}/lib
        run: cargo nextest run -p roml-highs --no-default-features --features system

  package:
    name: Package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
      - run: cargo package -p roml --locked
      - name: Packed consumer test (roml)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          mkdir -p /tmp/packed-test && cd /tmp/packed-test
          tar xzf "$GITHUB_WORKSPACE/target/package/roml-${VERSION}.crate"
          cd "roml-${VERSION}"
          cargo check
      - run: cargo check -p roml-highs --features bundled
