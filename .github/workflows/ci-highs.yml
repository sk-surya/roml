name: CI - HiGHS Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bundled:
    name: Test (bundled, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config
      - name: Install cmake (Windows)
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
      - name: Install ninja (Windows, if missing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress
          } else {
            Write-Output "ninja already present: $(ninja --version)"
          }
      - name: Test roml-highs (bundled)
        run: cargo nextest run -p roml-highs --features bundled
      - name: Run doctests
        run: cargo test -p roml-highs --features bundled --doc

  lint:
    name: Lint + doc (HiGHS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p roml-highs --all-targets --features bundled -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p roml-highs --no-deps --features bundled

  msrv:
    name: MSRV (HiGHS, 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - run: cargo check -p roml-highs --features bundled

  feature-exclusivity:
    name: Feature exclusivity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - run: "! cargo check -p roml-highs --features bundled,system 2>&1"

  system:
    name: Test (system, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - name: Set HiGHS install prefix
        run: echo "HIGHS_PREFIX=$HOME/highs-install" >> "$GITHUB_ENV"
      - name: Cache HiGHS 1.9.0 install
        id: highs-cache
        uses: actions/cache@v4
        with:
          path: ~/highs-install
          key: highs-1.9.0-${{ runner.os }}
      - name: Build HiGHS 1.9.0 from source
        if: steps.highs-cache.outputs.cache-hit != 'true'
        run: |
          HIGHS_VERSION=1.9.0
          curl -fsSL "https://github.com/ERGO-Code/HiGHS/archive/refs/tags/v${HIGHS_VERSION}.tar.gz" -o highs.tar.gz
          tar xzf highs.tar.gz
          cd "HiGHS-${HIGHS_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HIGHS_PREFIX" -GNinja
          ninja && ninja install
      - name: Test roml-highs (system discovery)
        env:
          PKG_CONFIG_PATH: ${{ env.HIGHS_PREFIX }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.HIGHS_PREFIX }}/lib
        run: cargo nextest run -p roml-highs --no-default-features --features system

  package:
    name: Package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - run: cargo package -p roml --locked
      - name: Packed consumer test (roml)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          mkdir -p /tmp/packed-test && cd /tmp/packed-test
          tar xzf "$GITHUB_WORKSPACE/target/package/roml-${VERSION}.crate"
          cd "roml-${VERSION}"
          cargo check
      - run: cargo check -p roml-highs --features bundled
