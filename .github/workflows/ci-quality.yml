name: CI - Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-and-policy:
    name: Coverage and policy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install nextest and llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Test quality-policy guard
        shell: bash
        run: bash scripts/test-quality-policy.sh

      - name: Enforce quality-policy guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            bash scripts/check-quality-policy.sh "origin/${{ github.base_ref }}"
          else
            bash scripts/check-quality-policy.sh HEAD^
          fi

      - name: Coverage gate
        run: cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path lcov.info --fail-under-lines 75

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: roml-lcov
          path: lcov.info

  mutation:
    name: Mutation score
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run core mutation tests
        run: cargo mutants --package roml --output mutants.out

      - name: Enforce mutation score
        run: python3 scripts/check-mutation-score.py mutants.out/outcomes.json 80

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: roml-mutation-report
          path: mutants.out
