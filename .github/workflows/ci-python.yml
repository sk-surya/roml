name: CI - Python Interface

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CACHE_VERSION: "2026-08"

jobs:
  build-test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: CI caches (apt + cargo/highs-sys)
        uses: ./.github/actions/ci-cache
        with:
          cache-version: ${{ env.CI_CACHE_VERSION }}
          cache-scope: python
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin "numpy>=2.0" pytest mypy
      - name: Build release wheel
        run: python -m maturin build --release --locked --manifest-path roml-python/Cargo.toml --out dist
      - name: Install wheel (outside the source tree)
        run: |
          python -m pip install dist/*.whl
          python -c "import roml, sys; assert 'site-packages' in roml.__file__, roml.__file__; print(roml.__file__)"
      - name: Python test suite (installed package)
        run: python -m pytest python/tests -q
      - name: Examples (from installed package)
        run: |
          python python/examples/production.py
          python python/examples/bess_mpc.py
      - name: Typing (strict example check)
        run: python -m mypy --strict python/examples/production.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          retention-days: 30

  sdist:
    name: Source distribution rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build sdist
        run: python -m maturin sdist --manifest-path roml-python/Cargo.toml --out dist
      - name: Rebuild wheel from extracted sdist
        run: |
          rm -rf /tmp/sdist-check && mkdir -p /tmp/sdist-check
          tar -xzf dist/*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/roml-python-*/
          python -m pip install maturin "numpy>=2.0"
          python -m maturin build --release --out /tmp/sdist-check/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 30
