[workspace]
members = [".", "roml-highs", "roml-mosek", "roml-xpress"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Surya Krishnan"]
repository = "https://github.com/sk-surya/roml"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
log = "0.4"

[package]
name = "roml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Rust Optimization Modeling Library for incremental MILP models"
# Packaging hygiene (P20 finding, API-10.3): the package root is the repository
# root, so without an include filter repo-level files (.planning/, tools/,
# .foundry.toml, badges/, docs/knowledge/) leak into the packed crate. The
# include list ships exactly the crate's intended files.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "MODELING_API.md",
    "MIGRATION.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "assets/roml-logo-v2.png",
    "src/**",
    "tests/**",
]

[lints]
# Core crate is solver-free; no unsafe allowed
rust.unsafe_code = "deny"
# missing_docs will be deny after P5 documentation debt is closed

[dependencies]
log = { workspace = true }

[dev-dependencies]
rand = "0.9"

[profile.dev]
opt-level = 0
