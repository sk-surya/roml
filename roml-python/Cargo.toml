[package]
name = "roml-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "PyO3 bindings for ROML (import namespace roml)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
roml = { version = "0.1.0", path = ".." }
roml-highs = { version = "0.1.0", path = "../roml-highs" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = { version = "0.29" }
